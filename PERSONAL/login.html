<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cafetería · Acceso del personal</title>
  <link rel="stylesheet" href="estilos.css?v=20261003-blue" />
</head>
<body>
  <div class="login-wrap">
    <img class="marca-logo" src="../assets/cafetec-logo.png?v=20261003-blue" alt="CafeTec · Tecnológico Nacional de México" />
    <p class="titulo">Cafetería escolar</p>
    <p class="sub">Acceso del personal</p>

    <div class="card" id="caja">
      <div id="aviso"></div>
      <div class="campo">
        <label>Usuario o correo</label>
        <input type="text" id="correo" autocomplete="username" placeholder="Ej. LuisRoberto" />
      </div>
      <div class="campo">
        <label>Contraseña</label>
        <input type="password" id="clave" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button class="boton" id="btn-entrar">Entrar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="comun.js"></script>
  <script>
    function aviso(texto, tipo) {
      document.getElementById('aviso').innerHTML =
        texto ? `<div class="aviso ${tipo}">${texto}</div>` : '';
    }

    // Manda a cada quien segun su rol.
    function redirigir(rol) {
      if (rol === 'admin')  window.location.href = 'admin.html';
      else if (rol === 'cocina') window.location.href = 'cocina.html';
      else {
        // alumno o pendiente no entran por aqui.
        aviso('Esta entrada es solo para el personal de la cafetería.', 'error');
      }
    }

    document.getElementById('btn-entrar').addEventListener('click', async () => {
      const identificador = document.getElementById('correo').value.trim();
      const clave  = document.getElementById('clave').value;
      if (!identificador || !clave) { aviso('Escribe tu usuario y contraseña.', 'error'); return; }

      let usuarioNormalizado = identificador.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
      if (usuarioNormalizado === 'uisesmarino') usuarioNormalizado = 'ulisesmarino';
      const correo = identificador.includes('@')
        ? identificador.toLowerCase()
        : `${usuarioNormalizado}@costagrande.tecnm.mx`;

      const { error } = await db.auth.signInWithPassword({ email: correo, password: clave });
      if (error) { aviso('Usuario o contraseña incorrectos.', 'error'); return; }

      const rol = await obtenerRol();
      redirigir(rol);
    });

    document.getElementById('clave').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-entrar').click();
    });

    // Si ya hay sesion abierta, redirige directo.
    (async () => {
      const rol = await obtenerRol();
      if (rol === 'admin' || rol === 'cocina') redirigir(rol);
    })();
  </script>
</body>
</html>
