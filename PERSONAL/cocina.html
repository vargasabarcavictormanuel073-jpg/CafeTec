<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tablero de pedidos · CafeTec</title>
  <link rel="stylesheet" href="cocina-estilos.css?v=20261003-board" />
</head>
<body>

  <div class="encabezado">
    <div>
      <img class="marca-logo" src="../assets/cafetec-logo.png?v=20261003-blue" alt="CafeTec · Tecnológico Nacional de México" />
      <p class="titulo"><span class="en-vivo" aria-hidden="true"></span> Tablero de pedidos</p>
      <p class="subtitulo"><span id="fecha">Cargando…</span> · actualización en tiempo real</p>
    </div>
    <div class="stats">
      <div class="stat">
        <p class="label">En cocina</p>
        <p class="num" id="stat-cocina">0</p>
      </div>
      <div class="stat">
        <p class="label">Listos</p>
        <p class="num" id="stat-listos">0</p>
      </div>
      <a id="link-admin" href="admin.html"
         style="display:none;text-decoration:none;color:var(--brand);font-size:13px;align-self:center;border:1px solid var(--brand);border-radius:8px;padding:8px 14px;">
        ← Administración
      </a>
      <button class="salir-btn" onclick="cerrarSesion()"
              style="background:none;border:1px solid #c4c2b8;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;align-self:center;">
        Salir
      </button>
    </div>
  </div>

  <div class="contenedor" id="franjas">
    <p class="cargando">Verificando acceso…</p>
  </div>

  <div class="contenedor" id="bloqueados-cont" style="display:none; margin-top:20px;">
    <h3 style="font-size:16px; font-weight:600; margin:0 0 10px;">Alumnos bloqueados</h3>
    <div id="bloqueados"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="comun.js"></script>
  <script src="cocina.js"></script>

</body>
</html>
